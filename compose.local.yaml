services:
  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      API_ENABLED: "true"
      DATABASE_URL: postgresql://coffee_bot:coffee_bot@db:5432/coffee_bot
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
      LOG_FILE_PATH: /app/logs/app.log
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coffee_bot
      POSTGRES_USER: coffee_bot
      POSTGRES_PASSWORD: coffee_bot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_bot -d coffee_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - coffee-bot-db:/var/lib/postgresql/data

volumes:
  coffee-bot-db:
