services:
  bot:
    build: .
    container_name: coffee-bot
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      API_ENABLED: "true"
      DATABASE_URL: postgresql://coffee_bot:coffee_bot@db:5432/coffee_bot
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
      LOG_FILE_PATH: /app/logs/app.log
    ports:
      - "172.22.1.1:3001:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./.runtime:/app/.runtime
  db:
    image: postgres:16-alpine
    container_name: coffee-bot-db
    environment:
      POSTGRES_DB: coffee_bot
      POSTGRES_USER: coffee_bot
      POSTGRES_PASSWORD: coffee_bot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_bot -d coffee_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - ./db_storage:/var/lib/postgresql/data
